 <!DOCTYPE html>

<title>الحيوانات وأصواتها</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:#f0f0f0;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.animal{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 5px gray;
    width:220px;
}

img{
    width:200px;
    height:150px;
    object-fit:contain;
    background:white;
}
button{
    margin-top:10px;
    padding:8px 15px;
    cursor:pointer;
}
</style>
</head>
